<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đảo Đèn Lồng — Đêm 1: Đảo Bến</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #070510; font-family: system-ui, -apple-system, sans-serif; color: #fff7e6; }
    #hud {
      position: fixed; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    .panel {
      background: rgba(14, 10, 26, 0.78);
      border: 1px solid rgba(255, 190, 90, 0.35);
      border-radius: 12px; padding: 12px 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }
    .stat-row { display: flex; gap: 18px; align-items: center; font-size: 15px; font-weight: 600; }
    .amber { color: #ffb84d; }
    .violet { color: #c084fc; }
    .controls {
      position: fixed; bottom: 16px; left: 16px;
      font-size: 13px; line-height: 1.5; opacity: 0.9;
      pointer-events: none; z-index: 10;
    }
    #prompt {
      position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 180, 60, 0.92); color: #1b1020;
      padding: 8px 18px; border-radius: 999px; font-weight: 700; font-size: 14px;
      display: none; z-index: 10;
    }
    #overlay {
      position: fixed; inset: 0; background: rgba(6, 4, 14, 0.84);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 20; text-align: center;
    }
    #overlay h1 { font-size: 38px; color: #ffcb6b; }
    #overlay p { font-size: 18px; max-width: 440px; line-height: 1.5; }
    #restartBtn {
      background: linear-gradient(135deg, #ffb347, #ff7b29);
      color: #190d1b; border: none; border-radius: 10px;
      padding: 12px 28px; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    #restartBtn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div id="hud">
    <div class="panel stat-row">
      <span>🔥 Ngọn lửa: <strong id="hudFlames" class="amber">3</strong></span>
      <span>✨ Đom đóm: <strong id="hudCarried" class="amber">0 / 5</strong></span>
      <span>🏮 Đèn Lớn: <strong id="hudLanterns" class="amber">0 / 5</strong></span>
    </div>
    <div class="panel stat-row">
      <span>⏳ Còn lại: <strong id="hudTime">03:00</strong></span>
      <span>⭐ Điểm: <strong id="hudScore" class="amber">0</strong></span>
    </div>
  </div>

  <div id="prompt">Nhấn [F] để nạp ánh sáng vào Đèn Lớn</div>

  <div class="panel controls">
    <strong>Điều khiển:</strong> WASD / Mũi tên: Di chuyển · Space: Nhảy · F / Enter: Thắp đèn · Shift / K: Tỏa sáng xua Bóng Mực (tốn 1 đom đóm) · Kéo chuột / Q, E: Xoay camera
  </div>

  <div id="overlay">
    <h1 id="overTitle">Chiến thắng!</h1>
    <p id="overDesc"></p>
    <button id="restartBtn">Chơi lại (R)</button>
  </div>

  <script src="/vendor/three.min.js"></script>
  <script src="/game.js"></script>
</body>
</html>
